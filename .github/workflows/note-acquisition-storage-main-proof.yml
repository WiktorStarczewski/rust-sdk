name: Rust main note acquisition proof

on:
  push:
    branches: [ci/note-acquisition-storage-main-proof]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  EXPECTED_SOURCE: 38e555fa33b2d40988752839451caa32ea2ea103

jobs:
  lint:
    name: Contributor lint on the exact source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select the signed feature source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git checkout --detach "$EXPECTED_SOURCE"
      - name: Install the repository toolchains
        run: |
          rustup update --no-self-update
          rustup component add clippy
          rustup toolchain install nightly --no-self-update
          rustup +nightly component add rustfmt
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486
        with:
          tool: cargo-shear@1.11.2,taplo-cli@0.10.0,typos@1.42.0
      - name: Run contributor lint
        run: |
          make lint
          git diff --exit-code

  retention:
    name: Both note acquisition regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select the signed feature source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git checkout --detach "$EXPECTED_SOURCE"
      - name: Install the repository toolchain
        run: rustup update --no-self-update
      - name: Verify waiting for import and refusing a later transport batch
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p miden-client-unit-tests --lib retention_gate_ 2>&1 | tee "$RUNNER_TEMP/note-acquisition-main.log"
          grep -F 'retention_gate_awaits_host_before_importing_a_note ... ok' "$RUNNER_TEMP/note-acquisition-main.log"
          grep -F 'retention_gate_refusal_keeps_transport_cursor_and_retries_notes ... ok' "$RUNNER_TEMP/note-acquisition-main.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/note-acquisition-main.log"
